name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Debian / Ubuntu (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Disable broken Microsoft APT repository
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install build dependencies
        run: |
          ./packaging/deps/deb.sh
          sudo apt-get install -y --no-install-recommends ccache

      - name: Prepare ccache directory
        run: mkdir -p "$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fedora-rpm:
    name: Fedora 41 (RPM dry run)
    runs-on: ubuntu-24.04
    container: fedora:41
    timeout-minutes: 45
    env:
      CCACHE_DIR: /github/home/.ccache
    steps:
      - name: Bootstrap container tools
        run: dnf install -y git tar gzip zstd which findutils ccache

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: bash ./packaging/deps/rpm.sh

      - name: Prepare ccache directory
        run: mkdir -p "$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.ccache
          key: fedora-41-ccache-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            fedora-41-ccache-

      - name: Configure
        run: >
          cmake -S . -B build-rpm
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-rpm --parallel "$(nproc)"

      - name: Build RPM (dry run)
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build-rpm/CPackConfig.cmake -G RPM
          rpm_path="$(find . -maxdepth 1 -name '*.rpm' -print -quit)"
          if [[ -z "$rpm_path" ]]; then
            echo "::error::CPack did not produce an RPM."
            exit 1
          fi
          rpm -qpi "$rpm_path" >/dev/null
          echo "RPM dry run succeeded: $rpm_path"

  arch-pkgbuild:
    name: Arch Linux (PKGBUILD)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Bootstrap container tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git tar gzip ca-certificates \
            which findutils sudo shadow

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create non-root builder
        shell: bash
        run: |
          set -euo pipefail
          useradd -m -G wheel -s /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          visudo -cf /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: sudo -u builder -H env PACMAN_NOCONFIRM=1 bash ./packaging/deps/arch.sh

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build-arch.sh <<'SCRIPT'
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          tarball="$(./scripts/cdm-release tarball)"
          version="$(./scripts/cdm-release version | sed -n 's/^tag version:[[:space:]]*//p')"
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve release version"
            exit 1
          fi

          pkgdir="packaging/arch"
          tarball_name="cdm-${version}.tar.gz"
          cp "$tarball" "$pkgdir/$tarball_name"

          cp "$pkgdir/PKGBUILD" "$pkgdir/PKGBUILD.bak"
          restore_pkgbuild() {
            mv -f "$pkgdir/PKGBUILD.bak" "$pkgdir/PKGBUILD"
          }
          trap restore_pkgbuild EXIT

          sed -i "s|^source=.*|source=(\"${tarball_name}::file://${PWD}/${pkgdir}/${tarball_name}\")|" "$pkgdir/PKGBUILD"
          sed -i "s|^pkgver=.*|pkgver=${version/-rc/rc}|" "$pkgdir/PKGBUILD"
          sed -i "s|^pkgrel=.*|pkgrel=1|" "$pkgdir/PKGBUILD"

          (
            cd "$pkgdir"
            rm -rf src pkg
            rm -f ./*.pkg.tar.zst
            updpkgsums
            makepkg -f --noconfirm
          )

          package="$(find "$pkgdir" -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "::error::makepkg did not produce an Arch package"
            exit 1
          fi
          pacman -Qpi "$package" >/dev/null
          echo "Arch package built: $package"
          SCRIPT
          chmod +x /tmp/build-arch.sh
          sudo -u builder -H env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash /tmp/build-arch.sh

  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify release metadata consistency
        run: python3 -B tests/test_release_bump.py

      - name: Ensure no stray temporary files
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::Working tree changed during release metadata checks:"
            printf '%s\n' "$status"
            exit 1
          fi
          stray="$(find . -path ./.git -prune -o -type f \
            \( -name '*.orig' -o -name '*.rej' -o -name '*~' -o -name '*.tmp' \
               -o -name '*.swp' -o -name 'cosign.key' -o -name '*.deb' -o -name '*.rpm' \
               -o -name 'SHA256SUMS.txt*' \) -print)"
          if [[ -n "$stray" ]]; then
            echo "::error::Stray temporary or packaging files found:"
            printf '%s\n' "$stray"
            exit 1
          fi
          echo "No stray temporary files found."
