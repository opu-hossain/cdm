name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Override channel for a manual release: rc or stable'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - rc
          - stable

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libnotify-dev libgtk-3-dev libcriterion-dev python3

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          release_file = Path('.release.toml')
          if not release_file.exists():
              raise SystemExit('Missing .release.toml; release metadata is required.')

          text = release_file.read_text(encoding='utf-8')
          channel = re.search(r'^channel\s*=\s*["\']?([A-Za-z0-9_-]+)["\']?', text, re.M)
          version = re.search(r'^version\s*=\s*["\']?([0-9]+\.[0-9]+\.[0-9]+)["\']?', text, re.M)
          rc_num = re.search(r'^rc\s*=\s*([0-9]+)', text, re.M)
          publish = re.search(r'^publish\s*=\s*(true|false)', text, re.M)
          channel_name = (channel.group(1) if channel else 'rc').strip()
          manual = os.environ.get('INPUT_CHANNEL', '').strip()
          if manual in {'rc', 'stable'}:
              channel_name = manual

          base_version = (version.group(1) if version else '0.1.0').strip()
          rc_value = int(rc_num.group(1)) if rc_num else 1
          resolved_version = f"{base_version}-rc{rc_value}" if channel_name == 'rc' else base_version
          publish_enabled = publish.group(1).strip().lower() == 'true' if publish else True

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"channel={channel_name}\n")
              out.write(f"version={resolved_version}\n")
              out.write(f"release_tag=v{resolved_version}\n")
              out.write(f"publish={str(publish_enabled).lower()}\n")
          PY
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}

      - name: Announce skip if publishing is disabled
        if: ${{ steps.meta.outputs.publish != 'true' }}
        run: |
          echo "Release publishing is disabled in .release.toml. Skipping remaining steps."

      - name: Configure build
        if: ${{ steps.meta.outputs.publish == 'true' }}
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build and test
        if: ${{ steps.meta.outputs.publish == 'true' }}
        run: |
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Build Debian package
        if: ${{ steps.meta.outputs.publish == 'true' }}
        run: |
          cpack --config build/CPackConfig.cmake -G DEB

      - name: Rename package to kernel-style naming
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PACKAGE_PATH="$(ls -1 ./*.deb | head -n 1)"
          NEW_PATH="./downloadmgr-${VERSION}-linux.deb"
          cp "$PACKAGE_PATH" "$NEW_PATH"
          echo "PACKAGE_PATH=$NEW_PATH" >> "$GITHUB_ENV"

      - name: Generate checksum
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(dirname "$PACKAGE_PATH")"
          BASE="$(basename "$PACKAGE_PATH")"
          ( cd "$DIR" && sha256sum "$BASE" ) > SHA256SUMS.txt

      - name: Install cosign
        if: ${{ steps.meta.outputs.publish == 'true' && env.COSIGN_PRIVATE_KEY != '' && env.COSIGN_PASSWORD != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        if: ${{ steps.meta.outputs.publish == 'true' && env.COSIGN_PRIVATE_KEY != '' && env.COSIGN_PASSWORD != '' }}
        run: |
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          chmod 600 cosign.key
          cosign sign-blob --yes --key cosign.key --output-signature SHA256SUMS.txt.sig SHA256SUMS.txt
          rm -f cosign.key

      - name: Collect release assets
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PACKAGE_PATH=$PACKAGE_PATH"
            echo "SHA256SUMS.txt"
            if [ -f SHA256SUMS.txt.sig ]; then echo "SHA256SUMS.txt.sig"; fi
          } > /tmp/assets.txt
          echo "ASSETS<<EOF" >> "$GITHUB_ENV"
          cat /tmp/assets.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: ${{ steps.meta.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          files: ${{ env.ASSETS }}
