<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm download — cdm</title>
  <style>
    :root {
      --bg: #0b0f14; --surface: #111722; --surface2: #161e2c;
      --border: #232d3d; --text: #e8ecf1; --muted: #7c8a9d;
      --accent: #3d9dcf; --accent-dim: #1f5c80;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 14px/1.45 "Segoe UI", Inter, system-ui, sans-serif; }
    .window { width: min(480px, calc(100vw - 24px)); overflow: hidden;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); box-shadow: 0 18px 60px #0009; }
    header { height: 48px; display: flex; align-items: center; gap: 10px;
      padding: 0 17px; border-bottom: 1px solid var(--border); }
    .mark { width: 23px; height: 23px; display: grid; place-items: center;
      border-radius: 6px; background: var(--accent-dim); color: #d9f2ff;
      font-size: 12px; font-weight: 700; }
    .brand { font-weight: 650; letter-spacing: .1px; }
    .tag { margin-left: auto; color: var(--muted); font-size: 12px; }
    main { padding: 18px 20px 16px; }
    h1 { margin: 0 0 15px; font-size: 18px; font-weight: 650; }
    label { display: block; margin: 13px 0 5px; color: #c8d1dc;
      font-size: 12px; font-weight: 600; }
    .url { padding: 9px 10px; overflow: hidden; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg); color: var(--muted);
      white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    input { width: 100%; height: 36px; padding: 0 10px; outline: none;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text); font: inherit; }
    input:focus { border-color: var(--accent); }
    .path-row { display: flex; gap: 8px; }
    .path-row input { flex: 1; min-width: 0; }
    button { border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface2); color: var(--text); font: inherit;
      cursor: pointer; }
    .browse { padding: 0 12px; color: #cbd5e1; font-size: 12px; }
    .size { margin-top: 11px; color: var(--muted); font-size: 12px; }
    footer { display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 20px 17px; }
    .action { min-width: 88px; height: 34px; padding: 0 15px; }
    .primary { border-color: var(--accent); background: var(--accent);
      color: #07131b; font-weight: 650; }
  </style>
</head>
<body>
  <section class="window" aria-label="Confirm download">
    <header><span class="mark">c</span><span class="brand">cdm</span>
      <span class="tag">Browser download</span></header>
    <main>
      <h1>Review download</h1>
      <label>Download URL</label>
      <div class="url">https://downloads.example.org/releases/core-tool-2.4.1-x86_64.tar.zst</div>
      <label for="filename">Save as</label>
      <input id="filename" value="core-tool-2.4.1-x86_64.tar.zst">
      <label for="folder">Destination folder</label>
      <div class="path-row"><input id="folder" value="/home/alex/Downloads">
        <button class="browse" type="button">Browse…</button></div>
      <div class="size">File size&nbsp;&nbsp; · &nbsp;&nbsp;84.6 MB</div>
    </main>
    <footer><button class="action" type="button">Cancel</button>
      <button class="action primary" type="button">Download</button></footer>
  </section>
</body>
</html>
